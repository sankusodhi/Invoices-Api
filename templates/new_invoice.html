{% extends "layout.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-6 mt-8">
    <h1 class="text-2xl font-bold mb-4">Create New Invoice</h1>
    <form method="POST" class="space-y-4">
        <!-- Customer Name Input -->
        <div>
            <label class="block text-gray-700 font-semibold">Customer Name</label>
            <input type="text" name="customer_name" required class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-400">
        </div>

        <!-- Amount Input -->
        <div>
            <label class="block text-gray-700 font-semibold">Amount</label>
            <input type="number" step="0.01" name="amount" required class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-400">
        </div>

        <div id="items-container">
            <div class="mb-2 flex gap-2">
                <input type="text" name="description[]" placeholder="Item Description" required
                       class="flex-1 border rounded px-3 py-2 focus:ring focus:border-blue-400">
                <input type="number" name="price[]" step="0.01" placeholder="Price" required
                       class="w-24 border rounded px-3 py-2 focus:ring focus:border-blue-400">
                <button type="button" class="remove-item-btn bg-red-500 text-white px-2 rounded">X</button>
            </div>
        </div>

        <!-- Add Item Button -->
        <div class="mt-4">
            <button type="button" id="add-item-btn" class="bg-blue-500 hover:bg-blue-600 text-blue px-4 py-2 rounded w-full">
                Add Item
            </button>
        </div>

        <!-- Submit Button -->
        <div class="mt-4">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-blue px-4 py-2 rounded w-full">
                Save Invoice
            </button>
        </div>
    </form>
</div>

<script>
    // Add Item Button Click Event
    document.getElementById('add-item-btn').addEventListener('click', () => {
        const container = document.getElementById('items-container');
        const newItem = document.createElement('div');
        newItem.className = 'mb-2 flex gap-2';
        newItem.innerHTML = `
            <input type="text" name="description[]" placeholder="Item Description" required
                   class="flex-1 border rounded px-3 py-2 focus:ring focus:border-blue-400">
            <input type="number" name="price[]" step="0.01" placeholder="Price" required
                   class="w-24 border rounded px-3 py-2 focus:ring focus:border-blue-400">
            <button type="button" class="remove-item-btn bg-red-500 text-white px-2 rounded">X</button>
        `;
        container.appendChild(newItem);

        // Add event listener to remove button for each added item
        newItem.querySelector('.remove-item-btn').addEventListener('click', e => {
            e.target.parentElement.remove();
        });
    });
</script>
{% endblock %}
