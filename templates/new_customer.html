{% extends "layout.html" %}
{% block content %}
<h1 class="text-xl font-bold mb-4">Add New Customer</h1>

<form method="POST" action="{{ url_for('new_customer') }}" class="bg-white p-4 rounded shadow w-1/2">
  <div class="mb-4">
    <label class="block mb-1">Name</label>
    <input type="text" name="name" class="border rounded w-full px-2 py-1" required>
  </div>

  <div class="mb-4">
    <label class="block mb-1">Email</label>
    <input type="email" name="email" class="border rounded w-full px-2 py-1" required>
  </div>

  <button type="submit" class="bg-green-500 text-blue px-4 py-2 rounded">Create</button>
  <a href="{{ url_for('customers_page') }}" class="ml-2 text-gray-600">Cancel</a>
</form>
{% endblock %}
