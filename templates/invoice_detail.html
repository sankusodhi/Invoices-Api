{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold">Invoice for {{ invoice.customer_name }}</h2>
<p><strong>Date:</strong> {{ invoice.date }}</p>

<ul class="mt-4 space-y-2">
  {% for item in invoice.items %}
    <li class="flex justify-between border-b py-2">
      <span>{{ item.name }}</span>
      <span>₹{{ item.price }}</span>
    </li>
  {% endfor %}
</ul>

<p class="mt-4 font-bold">Total: ₹{{ invoice.total }}</p>

<a href="/invoices/{{ invoice.id }}/pdf" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded">Download PDF</a>
{% endblock %}
