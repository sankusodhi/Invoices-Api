<!DOCTYPE html>
<html>
<head>
    <title>Invoices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function confirmDelete(invoiceId) {
            if (confirm("Are you sure you want to delete this invoice?")) {
                fetch(`/api/invoices/${invoiceId}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer your-secret-token" }
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || "Deleted");
                    location.reload();
                });
            }
        }
    </script>
</head>
<body class="p-6 bg-gray-100 min-h-screen">
    <h2 class="text-3xl font-semibold mb-6">Invoices</h2>
    <a href="/invoices/new" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded mb-4">
        New Invoice
    </a>
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white shadow rounded-lg overflow-hidden">
            <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="text-left py-3 px-4 uppercase font-semibold text-sm">ID</th>
                    <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Customer</th>
                    <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Date</th>
                    <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Total</th>
                    <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for invoice in invoices %}
                <tr class="border-b hover:bg-gray-100">
                    <td class="py-3 px-4">{{ invoice.id }}</td>
                    <td class="py-3 px-4">{{ invoice.customer.name }}</td>
                    <td class="py-3 px-4">{{ invoice.date }}</td>
                    <td class="py-3 px-4">{{ "%.2f"|format(invoice.total) }}</td>
                    <td class="py-3 px-4 space-x-2">
                        <a href="{{ url_for('print_invoice', invoice_id=invoice.id) }}" target="_blank"
                           class="inline-block bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm">🖨 Print</a>
                        <a href="{{ url_for('download_invoice_pdf', invoice_id=invoice.id) }}"
                           class="inline-block bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">⬇ PDF</a>
                        <button onclick="confirmDelete({{ invoice.id }})"
                                class="inline-block bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">🗑 Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
